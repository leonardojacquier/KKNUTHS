# Umami self-hosted (Fase 6B) — analytics sin cookies, LGPD-friendly
# Sirve en localhost:3400; exponer vía Caddy en stats.vortex369.com.br
services:
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: umami
    restart: unless-stopped
    ports:
      - "127.0.0.1:3400:3000"
    environment:
      DATABASE_URL: postgresql://umami:umami_gnh_2026@umami-db:5432/umami
      DATABASE_TYPE: postgresql
      APP_SECRET: cambiar-por-una-frase-larga-y-unica
    depends_on:
      umami-db:
        condition: service_healthy
  umami-db:
    image: postgres:16-alpine
    container_name: umami-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: umami_gnh_2026
      POSTGRES_DB: umami
    volumes:
      - umami-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  umami-db-data:
