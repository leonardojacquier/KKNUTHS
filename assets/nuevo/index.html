<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grupo GNH — Generando Nuevos Horizontes</title>
  <meta name="description" content="Grupo GNH. Elige tu camino: Ventas o Institucional." />
  <script type="module" crossorigin src="./assets/gateway-CwbWLzHF.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/style-Bro0mBT4.js">
  <link rel="modulepreload" crossorigin href="./assets/index-SFc2wnMY.js">
  <link rel="stylesheet" crossorigin href="./assets/style-GznF3u3H.css">
  <link rel="stylesheet" crossorigin href="./assets/gateway-DgAPxJQC.css">
</head>
<body class="bg-navy font-body text-white antialiased">

  <!-- ============ GATEWAY (primeiro frame, 100svh) ============ -->
  <main id="gateway" class="relative flex h-[100svh] flex-col items-center justify-center overflow-hidden px-6">

    <!-- 1. LOGO — SVG real em /public/img/gnh-logo.svg; placeholder de texto até o asset existir -->
    <div class="gw-logo mb-10">
      <img src="./img/gnh-logo.svg" alt="GNH" class="h-16 w-auto"
           onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
      <span class="gw-logo-text hidden font-display text-5xl font-bold tracking-tight" style="display:none">GNH</span>
    </div>

    <!-- 2. HORIZONTE — linha assinatura + "sol" -->
    <div class="gw-horizon" aria-hidden="true">
      <div class="gw-line"></div>
      <div class="gw-sun"></div>
    </div>

    <!-- 3. WORDMARK -->
    <p class="gw-wordmark mt-8 text-center font-body text-[11px] uppercase text-white/55" data-str="wordmark"></p>

    <!-- 4. PORTAS -->
    <nav class="gw-doors mt-14 flex items-center gap-10 max-[560px]:flex-col max-[560px]:gap-6" aria-label="Elige tu camino">
      <a class="gw-door" href="ventas/" data-side="ventas">
        <span class="gw-door-label" data-str="ventas"></span>
        <span class="gw-door-arrow" aria-hidden="true">→</span>
      </a>
      <span class="gw-divider" aria-hidden="true"></span>
      <a class="gw-door" href="institucional/" data-side="institucional">
        <span class="gw-door-label" data-str="institucional"></span>
        <span class="gw-door-arrow" aria-hidden="true">→</span>
      </a>
    </nav>
  </main>

</body>
</html>
