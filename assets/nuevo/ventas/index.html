<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GNH Ventas — Equipos, Aditivos, Fletes, Cemento y Morteros | Paraguay</title>
  <meta name="description" content="Canal B2B de GNH: equipos, aditivos, fletes, cemento y morteros. Fichas técnicas, catálogos y cotización directa por WhatsApp. Paraguay y Brasil." />
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&f[]=general-sans@400,500,600&display=swap" rel="stylesheet">
  <script type="module" crossorigin src="../assets/ventas-CLbi048T.js"></script>
  <link rel="modulepreload" crossorigin href="../assets/style-BpD7nbEK.js">
  <link rel="stylesheet" crossorigin href="../assets/style-BDCb4mx-.css">
  <link rel="stylesheet" crossorigin href="../assets/ventas-CINgLwAH.css">
</head>
<body class="bg-paper font-body text-ink antialiased">

  <!-- ============ TOP BAR (oscuro, igual al institucional) ============ -->
  <header class="sticky top-0 z-40 border-b border-white/10 bg-navy/95 text-white backdrop-blur">
    <div class="mx-auto flex max-w-6xl items-center justify-between px-5 py-3">
      <a href="../" class="flex items-center gap-2" aria-label="GNH — inicio">
        <!-- Logo oficial GNH (misma del institucional: logo_b.png); si falla, entra el SVG blanco de respaldo -->
        <img src="https://gnhorizons.com/assets/images/logo_b.png" alt="GNH" class="h-10 w-auto"
             onerror="if(!this.dataset.f){this.dataset.f=1;this.src='https://gnhorizons.com/assets/img/logo_b.png'}else{this.style.display='none';this.nextElementSibling.style.display='block'}">
        <svg viewBox="0 0 230 80" class="h-10 w-auto" style="display:none" role="img" aria-label="GNH">
          <circle cx="38" cy="46" r="27" stroke="#fff" stroke-width="3.2" fill="none"/>
          <ellipse cx="38" cy="46" rx="15" ry="27" stroke="#fff" stroke-width="1.8" fill="none"/>
          <line x1="11" y1="46" x2="65" y2="46" stroke="#fff" stroke-width="1.8"/>
          <line x1="14" y1="33" x2="62" y2="33" stroke="#fff" stroke-width="1.4"/>
          <line x1="14" y1="59" x2="62" y2="59" stroke="#fff" stroke-width="1.4"/>
          <path d="M 16 21 Q 38 7 60 21" stroke="#F26D21" stroke-width="6" fill="none" stroke-linecap="round"/>
          <text x="78" y="57" font-family="Satoshi,Arial,sans-serif" font-weight="800" font-size="31" fill="#fff" letter-spacing="1">GNH</text>
        </svg>
      </a>
      <nav class="hidden items-center gap-6 text-sm font-medium md:flex">
        <a href="#catalog" class="text-white/85 hover:text-orange">Catálogo</a>
        <a href="#promos" class="text-white/85 hover:text-orange">Promociones</a>
        <a href="#cotizar" class="text-white/85 hover:text-orange">Cotizar</a>
        <a href="../institucional/" class="text-white/85 hover:text-orange">Institucional</a>
      </nav>
      <a href="#cotizar" class="rounded-full bg-orange px-5 py-2 text-sm font-bold text-white transition hover:brightness-110">Cotizar</a>
    </div>
  </header>

  <!-- ============ FAIXA SUPERIOR (solo el rótulo) ============ -->
  <div class="bg-navy text-white">
    <div class="mx-auto max-w-6xl px-6 py-3">
      <span class="font-display text-xs font-bold uppercase tracking-[0.3em] text-orange">Canal de Ventas B2B</span>
    </div>
  </div>

  <!-- ============ SHOWCASE — carrusel cinematográfico full-width (render por JS) ============ -->
  <section id="hero-carousel" aria-label="Líneas destacadas"></section>

  <!-- ============ BUSCADOR INTELIGENTE ============ -->
  <section class="bg-navy pb-14 pt-12" id="buscar">
    <div class="mx-auto max-w-6xl px-5">
      <span class="font-display text-xs font-bold uppercase tracking-[0.3em] text-orange">Asistente de compra</span>
      <h2 class="mt-2 font-display text-2xl md:text-3xl font-bold uppercase tracking-[-0.02em] text-white">¿Qué necesitás <span class="text-orange">resolver</span>?</h2>
      <div class="bsc-box mt-5">
        <svg viewBox="0 0 24 24" class="bsc-ic" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="buscador-input" type="search" autocomplete="off"
               placeholder="Escribí tu problema o producto: impermeabilizar un tanque, fisuras, piso industrial, desmoldante…">
      </div>
      <div id="buscador-results" class="bsc-results"></div>
    </div>
  </section>

  <!-- ============ CATÁLOGO (renderizado por JS desde CATALOG) ============ -->
  <main id="catalog" class="mx-auto max-w-6xl px-5 py-16"></main>

  <!-- ============ PROMOCIONES (se oculta si vacío) ============ -->
  <section id="promos" class="mx-auto max-w-6xl px-5 pb-8"></section>

  <!-- ============ COTIZACIÓN (V5 / lead) ============ -->
  <section id="cotizar" class="bg-white py-16">
    <div class="mx-auto max-w-2xl px-6">
      <span class="font-display text-sm font-bold uppercase tracking-[0.28em] text-orange">Cotización</span>
      <h2 class="mt-2 font-display text-2xl md:text-3xl font-bold uppercase tracking-[-0.02em] text-navy">Pedí tu presupuesto</h2>
      <p class="mt-2 text-slate">Respondemos por WhatsApp en el día.</p>
      <form id="quote-form" class="mt-6 grid gap-4" autocomplete="off" novalidate>
        <div class="grid gap-4 sm:grid-cols-2">
          <input name="nombre" required placeholder="Nombre" class="v-input" />
          <input name="empresa" placeholder="Empresa" class="v-input" />
        </div>
        <div class="grid gap-4 sm:grid-cols-2">
          <input name="whatsapp" required placeholder="WhatsApp" class="v-input" />
          <input name="producto" placeholder="Producto de interés" class="v-input" />
        </div>
        <textarea name="mensaje" rows="3" placeholder="Mensaje (opcional)" class="v-input"></textarea>
        <button type="submit" class="rounded-full bg-orange px-8 py-3 font-bold text-white transition hover:brightness-110">Enviar por WhatsApp</button>
        <p id="quote-status" class="text-sm"></p>
      </form>
    </div>
  </section>

  <!-- ============ FOOTER común ============ -->
  <div id="footer-slot"></div>

</body>
</html>
