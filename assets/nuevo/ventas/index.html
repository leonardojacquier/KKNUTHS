<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GNH Ventas — Equipos, Aditivos, Fletes, Cemento y Morteros | Paraguay</title>
  <meta name="description" content="Canal B2B de GNH: equipos, aditivos, fletes, cemento y morteros. Fichas técnicas, catálogos y cotización directa por WhatsApp. Paraguay y Brasil." />
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&f[]=general-sans@400,500,600&display=swap" rel="stylesheet">
  <script type="module" crossorigin src="../assets/ventas-DASvQXPy.js"></script>
  <link rel="modulepreload" crossorigin href="../assets/style-CsVGQoPs.js">
  <link rel="stylesheet" crossorigin href="../assets/style-cGdpnNxM.css">
  <link rel="stylesheet" crossorigin href="../assets/ventas-vtDvHH_E.css">
</head>
<body class="bg-paper font-body text-ink antialiased">

  <!-- ============ TOP BAR (leve) ============ -->
  <header class="sticky top-0 z-40 border-b border-black/5 bg-paper/85 backdrop-blur">
    <div class="mx-auto flex max-w-6xl items-center justify-between px-5 py-3">
      <a href="../" class="flex items-center gap-2" aria-label="GNH — inicio">
        <img src="/img/gnh-logo-dark.svg" alt="GNH" class="h-9 w-auto"
             onerror="this.onerror=null;this.src='/img/gnh-logo.svg'">
      </a>
      <nav class="hidden items-center gap-6 text-sm font-medium md:flex">
        <a href="#catalog" class="hover:text-orange">Catálogo</a>
        <a href="#promos" class="hover:text-orange">Promociones</a>
        <a href="#cotizar" class="hover:text-orange">Cotizar</a>
        <a href="../institucional/" class="hover:text-orange">Institucional</a>
      </nav>
      <a href="#cotizar" class="rounded-full bg-orange px-5 py-2 text-sm font-bold text-white transition hover:brightness-110">Cotizar</a>
    </div>
  </header>

  <!-- ============ HERO leve (sin video pesado) ============ -->
  <section class="relative overflow-hidden bg-navy text-white">
    <div class="mx-auto max-w-6xl px-6 py-20 md:py-28">
      <span class="font-display text-sm font-bold uppercase tracking-[0.28em] text-orange">Canal mayorista B2B</span>
      <h1 class="mt-3 font-display text-4xl font-bold uppercase leading-[0.98] tracking-[-0.02em] md:text-6xl">
        Todo para tu <span class="text-orange">obra</span>,<br>del origen al destino
      </h1>
      <p class="mt-5 max-w-xl text-white/70">Equipos, aditivos, fletes, cemento y morteros. Marcas internacionales con stock y logística en Paraguay y Brasil.</p>
      <div id="cat-chips" class="mt-8 flex flex-wrap gap-2"></div>
    </div>
  </section>

  <!-- ============ CATÁLOGO (renderizado por JS desde CATALOG) ============ -->
  <main id="catalog" class="mx-auto max-w-6xl px-5 py-16"></main>

  <!-- ============ PROMOCIONES (se oculta si vacío) ============ -->
  <section id="promos" class="mx-auto max-w-6xl px-5 pb-8"></section>

  <!-- ============ COTIZACIÓN (V5 / lead) ============ -->
  <section id="cotizar" class="bg-white py-16">
    <div class="mx-auto max-w-2xl px-6">
      <span class="font-display text-sm font-bold uppercase tracking-[0.28em] text-orange">Cotización</span>
      <h2 class="mt-2 font-display text-2xl md:text-3xl font-bold uppercase tracking-[-0.02em] text-navy">Pedí tu presupuesto</h2>
      <p class="mt-2 text-slate">Respondemos por WhatsApp en el día.</p>
      <form id="quote-form" class="mt-6 grid gap-4" autocomplete="off" novalidate>
        <div class="grid gap-4 sm:grid-cols-2">
          <input name="nombre" required placeholder="Nombre" class="v-input" />
          <input name="empresa" placeholder="Empresa" class="v-input" />
        </div>
        <div class="grid gap-4 sm:grid-cols-2">
          <input name="whatsapp" required placeholder="WhatsApp" class="v-input" />
          <input name="producto" placeholder="Producto de interés" class="v-input" />
        </div>
        <textarea name="mensaje" rows="3" placeholder="Mensaje (opcional)" class="v-input"></textarea>
        <button type="submit" class="rounded-full bg-orange px-8 py-3 font-bold text-white transition hover:brightness-110">Enviar por WhatsApp</button>
        <p id="quote-status" class="text-sm"></p>
      </form>
    </div>
  </section>

  <!-- ============ FOOTER común ============ -->
  <div id="footer-slot"></div>

</body>
</html>
