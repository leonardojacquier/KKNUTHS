<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>SteelCalc &#8211; Dimensionamento de Galp&#227;o Met&#225;lico</title>
<style>
:root{
  --blue:#1a56db;--blue-dark:#1e429f;--blue-light:#e8f0fe;
  --green:#057a55;--red:#e02424;--orange:#d97706;
  --gray-50:#f9fafb;--gray-100:#f3f4f6;--gray-200:#e5e7eb;
  --gray-300:#d1d5db;--gray-400:#9ca3af;--gray-500:#6b7280;
  --gray-600:#4b5563;--gray-700:#374151;--gray-800:#1f2937;
  --gray-900:#111827;--white:#fff;
  --radius:8px;--shadow:0 1px 3px rgba(0,0,0,.12),0 1px 2px rgba(0,0,0,.08);
  --shadow-md:0 4px 6px rgba(0,0,0,.1),0 2px 4px rgba(0,0,0,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;font-size:14px;color:var(--gray-800);background:var(--gray-50);min-height:100vh}
a{color:var(--blue);text-decoration:none}

/* &#9472;&#9472; HEADER &#9472;&#9472; */
header{background:linear-gradient(135deg,var(--blue-dark) 0%,var(--blue) 100%);color:#fff;padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:60px;box-shadow:var(--shadow-md)}
.logo{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700;letter-spacing:-.5px}
.logo svg{width:32px;height:32px}
.logo span.sub{font-size:11px;font-weight:400;opacity:.8;margin-top:2px}
.badge-nbr{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);border-radius:4px;padding:2px 8px;font-size:11px;font-weight:600}

/* &#9472;&#9472; TABS &#9472;&#9472; */
.tabs-bar{background:#fff;border-bottom:2px solid var(--gray-200);padding:0 24px;display:flex;gap:2px;overflow-x:auto}
.tab{padding:14px 18px;cursor:pointer;font-size:13px;font-weight:500;color:var(--gray-500);border-bottom:2px solid transparent;margin-bottom:-2px;white-space:nowrap;transition:color .15s,border-color .15s}
.tab:hover{color:var(--gray-700)}
.tab.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:600}
.tab-icon{margin-right:6px}

/* &#9472;&#9472; LAYOUT &#9472;&#9472; */
.main{max-width:1200px;margin:0 auto;padding:24px}
.section{display:none}.section.active{display:block}
.page-title{font-size:18px;font-weight:700;color:var(--gray-900);margin-bottom:4px}
.page-sub{font-size:13px;color:var(--gray-500);margin-bottom:20px}

/* &#9472;&#9472; CARDS &#9472;&#9472; */
.card{background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:20px;overflow:hidden}
.card-header{padding:14px 20px;border-bottom:1px solid var(--gray-100);display:flex;align-items:center;gap:8px;background:var(--gray-50)}
.card-header h3{font-size:14px;font-weight:600;color:var(--gray-800)}
.card-header .icon{width:18px;height:18px;color:var(--blue)}
.card-body{padding:20px}

/* &#9472;&#9472; GRID FORM &#9472;&#9472; */
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.form-grid-2{grid-template-columns:repeat(2,1fr)}
.form-grid-3{grid-template-columns:repeat(3,1fr)}
.form-grid-4{grid-template-columns:repeat(4,1fr)}
@media(max-width:768px){.form-grid,.form-grid-2,.form-grid-3,.form-grid-4{grid-template-columns:1fr 1fr}}
@media(max-width:500px){.form-grid,.form-grid-2,.form-grid-3,.form-grid-4{grid-template-columns:1fr}}

/* &#9472;&#9472; FORM ELEMENTS &#9472;&#9472; */
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;font-weight:600;color:var(--gray-600);text-transform:uppercase;letter-spacing:.4px}
.field .hint{font-size:11px;color:var(--gray-400);margin-top:2px}
input[type=text],input[type=number],select,textarea{
  width:100%;padding:9px 12px;border:1px solid var(--gray-300);border-radius:6px;
  font-size:13px;color:var(--gray-800);background:#fff;
  transition:border-color .15s,box-shadow .15s;outline:none
}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(26,86,219,.15)}
input[readonly]{background:var(--gray-100);color:var(--gray-500)}
.input-unit{position:relative}
.input-unit input{padding-right:44px}
.input-unit .unit{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:11px;font-weight:600;color:var(--gray-400);pointer-events:none}

/* &#9472;&#9472; BUTTONS &#9472;&#9472; */
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .15s}
.btn-primary{background:var(--blue);color:#fff}.btn-primary:hover{background:var(--blue-dark)}
.btn-success{background:var(--green);color:#fff}.btn-success:hover{filter:brightness(.9)}
.btn-outline{background:#fff;color:var(--gray-700);border:1px solid var(--gray-300)}.btn-outline:hover{background:var(--gray-50)}
.btn-danger{background:var(--red);color:#fff}.btn-danger:hover{filter:brightness(.9)}
.btn-lg{padding:12px 28px;font-size:15px}
.btn-group{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}

/* &#9472;&#9472; ALERTS / INFO BOXES &#9472;&#9472; */
.alert{padding:12px 16px;border-radius:6px;font-size:13px;margin-bottom:16px;display:flex;align-items:flex-start;gap:10px}
.alert-info{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af}
.alert-warn{background:#fffbeb;border:1px solid #fde68a;color:#92400e}
.alert-ok{background:#f0fdf4;border:1px solid #bbf7d0;color:#14532d}
.alert-err{background:#fef2f2;border:1px solid #fecaca;color:#991b1b}
.alert svg{width:16px;height:16px;flex-shrink:0;margin-top:1px}

/* &#9472;&#9472; RESULT BOXES &#9472;&#9472; */
.result-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-top:16px}
.result-card{background:var(--blue-light);border:1px solid #bfdbfe;border-radius:8px;padding:16px;text-align:center}
.result-card .val{font-size:26px;font-weight:700;color:var(--blue-dark);line-height:1}
.result-card .lbl{font-size:11px;color:var(--blue-dark);margin-top:6px;text-transform:uppercase;font-weight:600}
.result-card .unit{font-size:13px;color:var(--gray-500);margin-top:2px}
.result-card.ok{background:#f0fdf4;border-color:#bbf7d0}.result-card.ok .val,.result-card.ok .lbl{color:#166534}
.result-card.warn{background:#fffbeb;border-color:#fde68a}.result-card.warn .val,.result-card.warn .lbl{color:#92400e}
.result-card.err{background:#fef2f2;border-color:#fecaca}.result-card.err .val,.result-card.err .lbl{color:#991b1b}

/* &#9472;&#9472; DIVIDER &#9472;&#9472; */
.divider{border:none;border-top:1px solid var(--gray-200);margin:20px 0}
.section-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--gray-400);margin-bottom:12px;margin-top:4px}

/* &#9472;&#9472; TABLE &#9472;&#9472; */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{background:var(--gray-50);padding:10px 12px;text-align:left;font-weight:600;color:var(--gray-600);font-size:12px;border-bottom:2px solid var(--gray-200)}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--gray-100);color:var(--gray-700)}
.tbl tbody tr:hover{background:var(--gray-50)}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.tbl .mono{font-family:monospace;font-size:12px}

/* &#9472;&#9472; STATUS CHIP &#9472;&#9472; */
.chip{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600}
.chip-ok{background:#dcfce7;color:#166534}
.chip-warn{background:#fef9c3;color:#854d0e}
.chip-err{background:#fee2e2;color:#991b1b}
.chip-info{background:#dbeafe;color:#1e40af}

/* &#9472;&#9472; SCHEMATIC SVG BOX &#9472;&#9472; */
.schematic-box{background:var(--gray-50);border:1px solid var(--gray-200);border-radius:8px;padding:16px;text-align:center;margin-bottom:16px}
.schematic-box svg{max-width:100%;height:auto}

/* &#9472;&#9472; PRINT &#9472;&#9472; */
@media print{
  .tabs-bar,.btn,.no-print{display:none!important}
  .section{display:block!important}
  .card{box-shadow:none;border:1px solid #ccc;break-inside:avoid}
  body{background:#fff}
}
</style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="logo">
    <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="32" height="32" rx="6" fill="rgba(255,255,255,0.15)"/>
      <path d="M4 24 L4 10 L16 6 L28 10 L28 24" stroke="white" stroke-width="2" fill="none" stroke-linejoin="round"/>
      <path d="M10 24 L10 16 L22 16 L22 24" stroke="white" stroke-width="1.5" fill="none"/>
      <path d="M4 10 L28 10" stroke="white" stroke-width="1.5"/>
      <path d="M16 6 L16 10" stroke="white" stroke-width="1.5"/>

    <div>
      SteelCalc
      <div class="sub">Dimensionamento de Galp&#227;o Met&#225;lico</div>

<!-- TABS -->
<div class="tabs-bar" id="tabsBar">
  <div class="tab active" data-tab="projeto">&#127959; Projeto</div>

  <div class="tab" data-tab="vento">&#128168; Vento (NBR 6123)</div>
  <div class="tab" data-tab="cargas">&#9878; Cargas</div>
  <div class="tab" data-tab="perfis">&#128297; Perfis de A&#231;o</div>
  <div class="tab" data-tab="portico">&#127963; P&#243;rtico</div>
  <div class="tab" data-tab="cobertura">&#127968; Cobertura</div>

  <div class="tab" data-tab="resultados">&#128202; Resultados</div>
</div>

<!-- MAIN CONTENT -->
<div class="main" id="mainContent">
</div>

</body>
</html>
<script>
// &#9472;&#9472; SECTIONS HTML &#9472;&#9472;
const sections = {};

sections.projeto = `
<div class="page-title">Informa&#231;&#245;es do Projeto</div>
<div class="page-sub">Dados gerais para identifica&#231;&#227;o e relat&#243;rio</div>
<div class="card">

sections.geometria = `
<div class="page-title">Geometria do Galp&#227;o</div>
<div class="page-sub">Dimens&#245;es gerais, modula&#231;&#227;o e forma da cobertura</div>

<div class="card">
  <div class="card-header"><h3>Dimens&#245;es Principais</h3></div>
  <div class="card-body">
    <div class="schematic-box" id="sketchBox">
      <svg id="svgSketch" width="420" height="200" viewBox="0 0 420 200">

      </svg>
    </div>
    <div class="form-grid form-grid-4">
      <div class="field"><label>V&#227;o (L)</label>
        <div class="input-unit"><input type="number" id="g_vao" value="15" min="5" max="80" step="0.5" oninput="updateSketch()"/><span class="unit">m</span></div>

      </div>
      <div class="field"><label>Comprimento (C)</label>
        <div class="input-unit"><input type="number" id="g_comp" value="30" min="6" max="300" step="1" oninput="updateSketch()"/><span class="unit">m</span></div>
        <span class="hint">Extens&#227;o longitudinal</span>
      </div>
      <div class="field"><label>P&#233;-Direito (H)</label>
        <div class="input-unit"><input type="number" id="g_pe" value="6" min="3" max="20" step="0.25" oninput="updateSketch()"/><span class="unit">m</span></div>
        <span class="hint">Altura da coluna</span>
      </div>
      <div class="field"><label>N&#250;mero de V&#227;os</label>
        <input type="number" id="g_nvao" value="1" min="1" max="6" step="1" oninput="updateSketch()"/>
        <span class="hint">P&#243;rticos paralelos</span>
      </div>
    </div>
    <hr class="divider"/>
    <div class="form-grid form-grid-4">
      <div class="field"><label>Inclina&#231;&#227;o do Telhado</label>
        <div class="input-unit"><input type="number" id="g_incl" value="10" min="3" max="45" step="1" oninput="updateSketch()"/><span class="unit">%</span></div>
        <span class="hint">Declividade em %</span>
      </div>
      <div class="field"><label>Tipo de Cobertura</label>
        <select id="g_cobert" onchange="updateSketch()">
          <option value="duas">Duas &#225;guas (sim&#233;trico)</option>
          <option value="uma">Uma &#225;gua</option>
          <option value="shed">Shed / Dente de Serra</option>
        </select>
      </div>
      <div class="field"><label>Espa&#231;amento entre P&#243;rticos</label>
        <div class="input-unit"><input type="number" id="g_esp" value="5" min="3" max="12" step="0.5" oninput="updateSketch()"/><span class="unit">m</span></div>
        <span class="hint">Dist&#226;ncia entre quadros</span>
      </div>
      <div class="field"><label>N&#186; de P&#243;rticos</label>
        <input type="number" id="g_nport" value="7" readonly style="background:#f3f4f6"/>
        <span class="hint">Calculado automaticamente</span>
      </div>
    </div>
  </div>
</div>

<div class="card">
  <div class="card-header"><h3>Avan&#231;os e Beiral</h3></div>
  <div class="card-body">
    <div class="form-grid form-grid-4">
      <div class="field"><label>Beiral (Avan&#231;o lateral)</label>
        <div class="input-unit"><input type="number" id="g_beiral" value="0.50" min="0" max="3" step="0.1"/><span class="unit">m</span></div>
      </div>
      <div class="field"><label>Avan&#231;o Frontal</label>
        <div class="input-unit"><input type="number" id="g_avanco" value="0.50" min="0" max="3" step="0.1"/><span class="unit">m</span></div>
      </div>
      <div class="field"><label>Calha</label>
        <select id="g_calha">
          <option value="nao">Sem calha</option>
          <option value="sim" selected>Com calha</option>
          <option value="interna">Calha interna</option>
        </select>
      </div>
      <div class="field"><label>Mezanino / Piso Interno</label>
        <select id="g_mez">
          <option value="nao" selected>N&#227;o</option>
          <option value="sim">Sim (definir em Cargas)</option>
        </select>
      </div>
    </div>
  </div>
</div>`;

sections.vento = `
<div class="page-title">A&#231;&#227;o do Vento &#8211; NBR 6123:1988</div>
<div class="page-sub">Velocidade b&#225;sica, fatores S1/S2/S3 e press&#227;o din&#226;mica de projeto</div>

<div class="card">
  <div class="card-header"><h3>Velocidade B&#225;sica do Vento (V&#8320;)</h3></div>

      <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"/></svg>
      Velocidade b&#225;sica V&#8320; = velocidade de rajada de 3 s, m&#233;dia em 10 min a 10 m de altura em terreno plano e desobstru&#237;do, com per&#237;odo de retorno de 50 anos (NBR 6123 Fig. 1).
    </div>
    <div class="form-grid form-grid-3">
      <div class="field"><label>Regi&#227;o (Isopleta)</label>
        <select id="v_regiao" onchange="autoV0()">
          <option value="">Selecione a regi&#227;o&#8230;</option>
          <option value="23.5">Zona 1 &#8211; Litoral Norte SP / PR / SC / RS &#8211; V&#8320; = 23,5 m/s</option>
          <option value="30">Zona 2 &#8211; Nordeste costeiro &#8211; V&#8320; = 30 m/s</option>
          <option value="30" selected>Zona 3 &#8211; Interior SP/MG/GO/MT &#8211; V&#8320; = 30 m/s</option>

      <div class="field"><label>V&#8320; &#8211; Velocidade b&#225;sica</label>

          <option value="1.0">50 anos (padr&#227;o)</option>

          <option value="1.10">100 anos</option>
          <option value="1.23">200 anos</option>
        </select>
      </div>
    </div>
  </div>
</div>

<div class="card">
  <div class="card-header"><h3>Fator S&#8321; &#8211; Topogr&#225;fico</h3></div>
  <div class="card-body">
    <div class="form-grid form-grid-2">
      <div class="field"><label>Topografia do Terreno</label>
        <select id="v_s1_tipo" onchange="calcVento()">
          <option value="1.0" selected>Plano ou suavemente ondulado &#8211; S&#8321; = 1,00</option>
          <option value="0.9">Vale ou depress&#227;o &#8211; S&#8321; = 0,90</option>

          <option value="custom">Outro valor</option>

      </div>
      <div class="field"><label>S&#8321; (valor)</label>
        <div class="input-unit"><input type="number" id="v_s1" value="1.00" min="0.7" max="1.3" step="0.01" oninput="calcVento()"/><span class="unit">&#8211;</span></div>
      </div>
    </div>
  </div>
</div>

<div class="card">
  <div class="card-header"><h3>Fator S&#8322; &#8211; Rugosidade, Dimens&#245;es e Altura</h3></div>
  <div class="card-body">
    <div class="form-grid form-grid-3">
      <div class="field"><label>Categoria de Terreno</label>
        <select id="v_cat" onchange="calcVento()">
          <option value="I">I &#8211; Mar aberto, lagos, p&#226;ntanos</option>
          <option value="II">II &#8211; Terreno aberto, poucos obst&#225;culos</option>
          <option value="III" selected>III &#8211; Terreno com obst&#225;culos baixos (&lt;3 m)</option>
          <option value="IV">IV &#8211; Terreno com obst&#225;culos de 3&#8211;10 m</option>
          <option value="V">V &#8211; Obst&#225;culos acima de 10 m, centros urbanos</option>

// &#9472;&#9472; GEOMETRIA &#9472;&#9472;
function updateSketch(){
  const L    = nv('g_vao')   || 15;
  const C    = nv('g_comp')  || 30;
  const H    = nv('g_pe')    || 6;
  const incl = nv('g_incl')  || 10;
  const esp  = nv('g_esp')   || 5;
  const comp = nv('g_comp')  || 30;
  const nport = Math.round(comp / esp) + 1;
  sv('g_nport', nport);

  const tipo = $('g_cobert')?.value || 'duas';
  const ridge = L * (incl/100) / 2;
  const W=420, Hsvg=200, pad=40;
  const sx = (W-2*pad)/L, sy = (Hsvg-2*pad)/(H+ridge+2);
  const bx = pad, by = Hsvg-pad;
  const x  = v => bx + v*sx;
  const y  = v => by - v*sy;

  let roofPath='';
  if(tipo==='duas'){
    roofPath=`M${x(0)},${y(H)} L${x(L/2)},${y(H+ridge)} L${x(L)},${y(H)}`;
  } else if(tipo==='uma'){
    roofPath=`M${x(0)},${y(H)} L${x(L)},${y(H+ridge*2)}`;
  } else {
    roofPath=`M${x(0)},${y(H)} L${x(L/2)},${y(H+ridge)} L${x(L/2)},${y(H)} L${x(L)},${y(H+ridge)}`;
  }

  const svg=`
<line x1="${x(0)}" y1="${y(0)}" x2="${x(0)}" y2="${y(H)}" stroke="#374151" stroke-width="3"/>
<line x1="${x(L)}" y1="${y(0)}" x2="${x(L)}" y2="${y(H)}" stroke="#374151" stroke-width="3"/>
<line x1="${x(0)}" y1="${y(0)}" x2="${x(L)}" y2="${y(0)}" stroke="#374151" stroke-width="2"/>
<path d="${roofPath}" stroke="#1a56db" stroke-width="3" fill="none"/>
<!-- ground -->
<line x1="${x(-1)}" y1="${y(0)}" x2="${x(L+1)}" y2="${y(0)}" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4,3"/>
<!-- dims -->
<line x1="${x(0)}" y1="${by+14}" x2="${x(L)}" y2="${by+14}" stroke="#6b7280" stroke-width="1" marker-end="url(#arrow)"/>
<text x="${x(L/2)}" y="${by+26}" text-anchor="middle" fill="#374151" font-size="11" font-weight="600">L = ${L} m</text>
<line x1="${x(L)+14}" y1="${y(0)}" x2="${x(L)+14}" y2="${y(H)}" stroke="#6b7280" stroke-width="1"/>
<text x="${x(L)+22}" y="${y(H/2)}" fill="#374151" font-size="10" dominant-baseline="middle">H=${H}m</text>
`;
  const svgEl = document.getElementById('svgSketch');
  if(svgEl) svgEl.innerHTML = `<defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" stroke="#6b7280" fill="none"/></marker></defs>`+svg;
}

// &#9472;&#9472; VENTO NBR 6123 &#9472;&#9472;
function autoV0(){
  const v = $('v_regiao')?.value;
  if(v && v!=='custom') sv('v_v0', v);
  calcVento();
}
function calcVento(){
  const V0  = nv('v_v0');
  const S1  = nv('v_s1') || parseFloat($('v_s1_tipo')?.value) || 1.0;
  sv('v_s1', S1.toFixed(2));
  const S3  = nv('v_s3') || parseFloat($('v_s3_tipo')?.value) || 1.0;
  sv('v_s3', S3.toFixed(2));
  const tr  = parseFloat($('v_tr')?.value) || 1.0;
  const cat = $('v_cat')?.value  || 'III';
  const cls = $('v_classe')?.value || 'B';
  const hr  = nv('v_href') || 7;

  const [b,p,Fr] = S2_TABLE[cat]?.[cls] || [0.94,0.10,1.00];
  sv('v_b',b); sv('v_p',p); sv('v_Fr',Fr);

  const S2 = Fr * b * Math.pow(hr/10, p);
  sv('rS2', S2.toFixed(4));

  const Vk = V0 * S1 * S2 * S3 * tr;
  const q  = 0.613 * Vk * Vk;   // N/m&#178;

  sv('rVk', Vk.toFixed(2));
  sv('rQ',  q.toFixed(1));
  sv('rQkPa', (q/1000).toFixed(4));
  window._Vk=Vk; window._q=q; window._S2=S2;
}

// &#9472;&#9472; P&#211;RTICO (m&#233;todo simplificado) &#9472;&#9472;
function calcPortico(){
  const qd  = nv('po_qd');
  const wh  = nv('po_wh');
  const L   = nv('po_L') || nv('g_vao') || 15;
  const H   = nv('po_H') || nv('g_pe')  || 6;
  const E   = 200000; // MPa
  const base= $('po_base')?.value || 'art';

  // Momento m&#225;ximo viga &#8211; viga biapoiada sob carga distribu&#237;da
  const Mv = qd * L * L / 8;
  // Cortante
  const Vv = qd * L / 2;
  // Normal pilar = rea&#231;&#227;o vertical
  const Np = qd * L / 2;
  // Momento no pilar (devido vento)
  const Mp = (base==='eng') ? wh*H*H/2 : wh*H*H/8;
  // Flecha viga (biapoiada, carga uniforme)
  // &#948; = 5qL&#8308;/384EI &#8594; sem I use placeholder; estimativa com W310x52: I~119&#215;10&#8310; mm&#8308;
  const I_est = 119e6; // mm&#8308; estimado W310&#215;52
  const q_mm  = qd / 1000;   // kN/mm
  const L_mm  = L * 1000;
  const E_MPa = E;
  const deltaV= 5 * q_mm * Math.pow(L_mm,4) / (384 * E_MPa * I_est);
  // Deslocamento horizontal pilar (carga uniformemente distribu&#237;da no pilar)
  const deltaH= (base==='eng') ? wh*1e-3*Math.pow(H*1e3,4)/(8*E_MPa*I_est) : wh*1e-3*Math.pow(H*1e3,3)/(3*E_MPa*I_est);

  const lim_delta = L*1000 / (parseInt($('pe_flecha')?.value)||300);
  const lim_dH    = H*1000 / 200;

  sv('po_M', fmt(Mv));
  sv('po_V', fmt(Vv));
  sv('po_N', fmt(Np));
  sv('po_M_pilar', fmt(Mp));
  sv('po_delta', fmt(deltaV));
  sv('po_delta_H', fmt(deltaH));

  const ok_delta = deltaV <= lim_delta;
  const ok_dH    = deltaH <= lim_dH;
  const el = $('po_check');
  if(el){
    el.className = (ok_delta&&ok_dH)?'alert alert-ok':'alert alert-warn';
    el.innerHTML = `<strong>&#948; viga:</strong> ${fmt(deltaV)} mm (lim. ${fmt(lim_delta)} mm) &#8594; <span class="chip ${ok_delta?'chip-ok':'chip-err'}">${ok_delta?'OK':'VERIFICAR'}</span>&emsp;<strong>&#948;H pilar:</strong> ${fmt(deltaH)} mm (lim. ${fmt(lim_dH)} mm) &#8594; <span class="chip ${ok_dH?'chip-ok':'chip-err'}">${ok_dH?'OK':'VERIFICAR'}</span><br/><em>Nota: flecha estimada com I &#8776; 119&#215;10&#8310; mm&#8308; (W310&#215;52). Refine com o perfil real.</em>`;
  }
  window._Mv=Mv; window._Np=Np; window._deltaV=deltaV;
}

// &#9472;&#9472; FUNDA&#199;&#195;O &#9472;&#9472;
function calcFundacao(){
  const sigma = nv('fund_sigma');
  const Nd    = nv('fund_nd');
  const Df    = nv('fund_df');
  const tipo  = $('fund_tipo')?.value || 'sapata';

  if(tipo==='sapata' && sigma>0 && Nd>0){
    // A = Nd / &#963;_adm  (kN / kPa = m&#178;)
    const A    = Nd / sigma;
    const lado = Math.ceil(Math.sqrt(A)*10)/10;   // arredonda 10 cm
    const h_min= Math.max(0.3, lado*0.25);         // h &#8776; 25% do lado, m&#237;n. 30 cm
    const vol  = lado*lado*h_min;
    sv('fund_A',   fmt(A,3));
    sv('fund_lado',fmt(lado,2));
    sv('fund_h',   fmt(h_min*100,0));   // cm
    sv('fund_vol', fmt(vol,3));
  }
}

// &#9472;&#9472; RESUMO &#9472;&#9472;
function gerarResumo(){
  calcVento(); calcPortico(); calcFundacao();
  sv('res_Vk',  fmt(window._Vk||0));
  sv('res_q',   fmt(window._q||0,1));
  sv('res_S2',  fmt(window._S2||0,4));
  sv('res_Mviga',fmt(window._Mv||0));
  sv('res_Npilar',fmt(window._Np||0));
  sv('res_delta', fmt(window._deltaV||0));
}

// &#9472;&#9472; RELAT&#211;RIO COMPLETO &#9472;&#9472;
function gerarRelatorio(){
  gerarResumo();
  const L = nv('g_vao')||15, C=nv('g_comp')||30, H=nv('g_pe')||6;
  const esp=nv('g_esp')||5;
  const nport=Math.round(C/esp)+1;
  const areaCob = (L * C);
  const areaFech= 2*(L+C)*H;
  const qtPilares=nport*2;
  const qtTercas = nport*Math.ceil(L/2/( nv('pe_terca_esp')||1.5));
  const volFund  = parseFloat($('fund_vol')?.value)||0;

  const rows=[
    ['&#193;rea de cobertura', areaCob.toFixed(1), 'm&#178;', ''],
