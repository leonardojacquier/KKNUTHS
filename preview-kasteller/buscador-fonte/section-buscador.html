<!-- ============ BUSCADOR DE PRODUCTOS (módulo independente) ============
     Cole esta seção onde quiser na página (sugestão: depois de #categorias).
     Requer: kasteller-buscador.css no <head> e kasteller-buscador.js antes de </body>.
     data-whatsapp: destino do CTA quando a busca não encontra nada. -->
<section class="kb" id="buscador" data-whatsapp="https://wa.me/595985869600">
  <div class="kb__eyebrow"><i></i>Catálogo</div>
  <h2>Buscá entre todas las marcas que representamos.</h2>

  <div class="kb__barwrap">
    <div class="kb__bar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>
      </svg>
      <input class="kb__input" type="search" autocomplete="off" spellcheck="false"
             placeholder="mármol, 120x120, madera, Roca, cocina..."
             aria-label="Buscar productos">
      <span class="kb__count"></span>
    </div>
    <div class="kb__sugs" role="listbox"></div>
    <div class="kb__chips"></div>
  </div>

  <div class="kb__grid"></div>

  <div class="kb__empty">
    <p>No encontramos esa combinación en el catálogo online — pero el showroom guarda mucho más.</p>
    <a href="https://wa.me/595985869600" target="_blank" rel="noopener"><span>Consultar por WhatsApp</span></a>
  </div>

  <button class="kb__more" hidden>Ver más productos</button>
</section>
