name: Deploy para vortex369

# Deploy automático a cada push na branch do site + botão manual.
# Único secret necessário: VORTEX_SSH_KEY (chave privada com acesso ao VPS).
# Sem o secret, o workflow passa em verde e apenas avisa que pulou o deploy.
on:
  workflow_dispatch:
  push:
    branches: [claude/professional-website-design-qqgnfg]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VORTEX_HOST: srv1555380.hstgr.cloud
      VORTEX_USER: root
      VORTEX_PATH: /opt/gnh
      HAS_KEY: ${{ secrets.VORTEX_SSH_KEY != '' }}
    steps:
      - name: Secret ausente — deploy pulado
        if: env.HAS_KEY != 'true'
        run: echo "VORTEX_SSH_KEY não configurado em Settings → Secrets. Deploy pulado."

      - name: Baixar código
        if: env.HAS_KEY == 'true'
        uses: actions/checkout@v4

      - name: Configurar chave SSH
        if: env.HAS_KEY == 'true'
        run: |
          mkdir -p ~/.ssh
          # normaliza CRLF do Windows e garante quebra final
          printf '%s\n' "${{ secrets.VORTEX_SSH_KEY }}" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null 2>&1; then
            echo "::error::VORTEX_SSH_KEY inválida — recole o secret com o conteúdo COMPLETO de /root/.ssh/gnh_deploy (da linha BEGIN até a linha END, sem cortar nada)"
            exit 1
          fi
          echo "Chave válida ✓"
          # keyscan é best-effort; o ssh abaixo usa accept-new como rede de segurança
          ssh-keyscan -4 -T 10 -H "$VORTEX_HOST" >> ~/.ssh/known_hosts 2>/dev/null || echo "keyscan falhou — seguindo com accept-new"

      - name: Enviar site e definir index.html
        if: env.HAS_KEY == 'true'
        run: |
          for i in 1 2; do
            tar czf - gnh-redesign.html assets \
              | ssh -4 -i ~/.ssh/deploy_key \
                  -o StrictHostKeyChecking=accept-new \
                  -o ConnectTimeout=20 \
                  "$VORTEX_USER@$VORTEX_HOST" \
                  "mkdir -p $VORTEX_PATH && tar xzf - -C $VORTEX_PATH && cd $VORTEX_PATH && cp gnh-redesign.html index.html && echo 'Deploy OK —' \$(md5sum index.html | cut -c1-10)" \
              && exit 0
            echo "tentativa $i falhou; aguardando 20s (fail2ban-friendly)"
            sleep 20
          done
          echo "::error::Deploy falhou após 2 tentativas"
          exit 1
