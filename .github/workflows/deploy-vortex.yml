name: Deploy para vortex369

# Disparo manual (Actions → Run workflow). Único secret necessário:
# VORTEX_SSH_KEY — chave privada SSH com acesso ao VPS.
# Para deploy automático a cada push, descomente o bloco "push".
on:
  workflow_dispatch:
  # push:
  #   branches: [claude/professional-website-design-qqgnfg]
  #   paths: ['gnh-redesign.html', 'assets/**']

env:
  VORTEX_HOST: srv1555380.hstgr.cloud
  VORTEX_USER: root
  VORTEX_PATH: /opt/gnh

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar chave SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VORTEX_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VORTEX_HOST" >> ~/.ssh/known_hosts

      - name: Enviar site e definir index.html
        run: |
          tar czf - gnh-redesign.html assets \
            | ssh -i ~/.ssh/deploy_key "$VORTEX_USER@$VORTEX_HOST" \
                "mkdir -p $VORTEX_PATH && tar xzf - -C $VORTEX_PATH && cd $VORTEX_PATH && cp gnh-redesign.html index.html && md5sum index.html"

      - name: Verificar md5
        run: md5sum gnh-redesign.html
