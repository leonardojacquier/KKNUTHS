name: Diagnóstico gnh.vortex369.com.br

on:
  workflow_dispatch:
  push:
    branches: [claude/professional-website-design-qqgnfg]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: DNS
        run: |
          getent hosts gnh.vortex369.com.br || echo "gnh NAO RESOLVE"
          getent hosts titancalc.vortex369.com.br || echo "titancalc NAO RESOLVE"

      - name: Home do site (conteúdo novo no ar?)
        run: |
          curl -sk -o /tmp/home.html -w "home status=%{http_code} tamanho=%{size_download}\n" \
            --max-time 20 https://gnh.vortex369.com.br/ || echo "HOME: FALHA DE CONEXAO"
          for m in "SZ34D" "plat-sheet" "sq22d-thumb" "jbts20"; do
            grep -qF "$m" /tmp/home.html && echo "OK   home contém: $m" || echo "FALTA na home: $m"
          done

      - name: Página equipos-de-concreto (caminho atual)
        run: |
          curl -sk -o /tmp/eq.html -w "assets/nuevo/ventas/equipos-de-concreto status=%{http_code} tamanho=%{size_download}\n" \
            --max-time 20 https://gnh.vortex369.com.br/assets/nuevo/ventas/equipos-de-concreto/ || echo "FALHA"
          grep -qF "jbts20" /tmp/eq.html && echo "OK   JBTS20 PRESENTE" || echo "JBTS20 AUSENTE"

      - name: Caminhos raiz (script novo instalado?)
        run: |
          for p in /ventas/ /ventas/equipos-de-concreto/ /fichas/pdf/central-concreto-jbts20.pdf /sitemap.xml; do
            curl -sk -o /dev/null -w "raiz $p status=%{http_code}\n" --max-time 20 "https://gnh.vortex369.com.br$p" || echo "raiz $p FALHA"
          done

      - name: Outros serviços do VPS (referência de saúde da caixa)
        run: |
          curl -sk -o /dev/null -w "titancalc status=%{http_code}\n" --max-time 20 https://titancalc.vortex369.com.br/ || echo "titancalc FALHA"
          curl -sk -o /dev/null -w "umami heartbeat status=%{http_code}\n" --max-time 20 https://stats.vortex369.com.br/api/heartbeat || echo "umami FALHA"

      - name: gnhorizons.com — JBTS20 no ar?
        run: |
          curl -sk -o /tmp/g.html -w "gnhorizons /ventas/equipos-de-concreto/ status=%{http_code} tamanho=%{size_download}\n" \
            --max-time 25 https://gnhorizons.com/ventas/equipos-de-concreto/ || echo FALHA
          grep -qF "jbts20" /tmp/g.html && echo "OK   JBTS20 NO GNHORIZONS" || echo "JBTS20 AUSENTE NO GNHORIZONS"
          curl -sk -o /dev/null -w "gnhorizons ficha PDF status=%{http_code}\n" --max-time 25 https://gnhorizons.com/fichas/pdf/central-concreto-jbts20.pdf || echo FALHA
          curl -sk -o /tmp/pp.html -w "gnhorizons página do produto status=%{http_code}\n" --max-time 25 https://gnhorizons.com/ventas/central-de-concreto-jbts20/ || echo FALHA
          grep -qF "Especificaciones técnicas" /tmp/pp.html && echo "OK   página do produto no ar" || echo "página do produto AUSENTE"
          echo "-- headers de cache do HTML --"
          curl -skI --max-time 25 https://gnhorizons.com/ventas/equipos-de-concreto/ | grep -iE 'cache-control|etag|last-modified|server' || true
          echo "-- catálogo /ventas/ tem o card? --"
          curl -sk --max-time 25 https://gnhorizons.com/ventas/ -o /tmp/vi.html
          grep -qF "JBTS20" /tmp/vi.html && echo "OK   card no catálogo (HTML)" || echo "card não está no HTML estático (vem do bundle JS)"
          grep -oE 'assets/ventas-[A-Za-z0-9_-]*\.js' /tmp/vi.html | head -2
