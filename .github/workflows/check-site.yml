name: Diagnóstico do site GNH

on:
  workflow_dispatch:
  push:
    branches: [claude/professional-website-design-qqgnfg]

# Uma execução por vez: o VPS tem fail2ban e dois runs simultâneos viram
# rajada de requisições — o segundo IP é banido e o run falha com timeout.
concurrency:
  group: check-site
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # O VPS roda fail2ban e já baniu o IP do runner antes: quando isso
      # acontece, TODAS as requisições dão 000 — inclusive titancalc e umami,
      # que nada têm a ver com o site — e o run vira uma parede de "AUSENTE"
      # que não distingue queda real de banimento. Por isso este job faz poucas
      # requisições, espaçadas, e separa "não alcancei" de "alcancei e o
      # conteúdo está errado".
      - name: Alcance do VPS (com retentativa)
        run: |
          for i in 1 2 3; do
            code=$(curl -sk -o /dev/null -w '%{http_code}' --max-time 15 https://gnhorizons.com/ || echo 000)
            echo "tentativa $i: gnhorizons.com -> $code"
            if [ "$code" != "000" ]; then
              exit 0
            fi
            if [ "$i" -lt 3 ]; then
              sleep 60
            fi
          done
          echo "DNS:"
          getent hosts gnhorizons.com || echo "  não resolve"
          echo "::error::VPS inalcançável do runner: o DNS resolve mas nenhuma conexão TCP completa. Duas causas possíveis, indistinguíveis daqui — fail2ban banindo o IP do runner (já aconteceu antes) ou queda real do servidor. Abra https://gnhorizons.com no navegador antes de agir."
          exit 1

      - name: Conteúdo no ar
        run: |
          # Uma conexão só, quatro requisições (curl reaproveita a conexão).
          curl -sk --max-time 25 \
                 -o /tmp/home.html    -w 'home                %{http_code}\n' https://gnhorizons.com/ \
            --next -o /tmp/ventas.html -w 'catálogo /ventas/   %{http_code}\n' https://gnhorizons.com/ventas/ \
            --next -o /tmp/prod.html   -w 'página de produto   %{http_code}\n' https://gnhorizons.com/ventas/bomba-transportadora-de-concreto/ \
            --next -I -o /tmp/hdr.txt  -w 'headers do produto  %{http_code}\n' https://gnhorizons.com/ventas/bomba-transportadora-de-concreto/

          falhas=0
          ver() {  # ver <arquivo> <marcador> <descrição>
            if grep -qF "$2" "$1" 2>/dev/null; then
              echo "OK     $3"
            else
              echo "FALHOU $3  (não achei '$2' em $(basename "$1"))"
              falhas=$((falhas + 1))
            fi
          }

          ver /tmp/home.html 'SZ34D'   'home traz a tabela de plataformas'
          ver /tmp/prod.html 'HBTS-50' 'página de produto com o camión bomba'

          # O HTML precisa sair com no-cache, senão o navegador segura a versão
          # velha e o deploy "não aparece". Ver DEPLOY-GNH.md § manutenção do VPS.
          ver /tmp/hdr.txt 'no-cache' 'subpágina de produto com Cache-Control: no-cache'

          # O bundle de busca é cacheado de forma imutável e renomeado a cada
          # alteração: se o hash publicado difere do hash do repo, o deploy não
          # chegou (ou chegou pela metade).
          esperado=$(grep -o 'assets/ventas-[A-Za-z0-9_-]*\.js' assets/nuevo/ventas/index.html | head -1)
          publicado=$(grep -o 'assets/ventas-[A-Za-z0-9_-]*\.js' /tmp/ventas.html | head -1)
          echo "bundle esperado:  ${esperado:-<nenhum>}"
          echo "bundle publicado: ${publicado:-<nenhum>}"
          if [ -n "$publicado" ] && [ "$esperado" = "$publicado" ]; then
            echo "OK     bundle publicado é o do commit"
          else
            echo "FALHOU bundle publicado diverge do repo — o cron do VPS ainda não pegou este commit (roda a cada 2 min), ou o deploy falhou"
            falhas=$((falhas + 1))
          fi

          echo
          if [ "$falhas" = "0" ]; then
            echo "Tudo no ar."
          else
            echo "$falhas verificação(ões) falharam."
            exit 1
          fi
