name: Diagnóstico do site GNH

on:
  workflow_dispatch:
  push:
    branches: [claude/professional-website-design-qqgnfg]

# Uma execução por vez: o VPS tem fail2ban e dois runs simultâneos viram
# rajada de requisições — o segundo IP é banido e o run falha com timeout.
concurrency:
  group: check-site
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # O VPS roda fail2ban e já baniu o IP do runner antes: quando isso
      # acontece, TODAS as requisições dão 000 — inclusive titancalc e umami,
      # que nada têm a ver com o site — e o run vira uma parede de "AUSENTE"
      # que não distingue queda real de banimento. Por isso este job faz poucas
      # requisições, espaçadas, e separa "não alcancei" de "alcancei e o
      # conteúdo está errado".
      - name: Alcance do VPS (com retentativa)
        run: |
          for i in 1 2 3; do
            code=$(curl -sk -o /dev/null -w '%{http_code}' --max-time 15 https://gnhorizons.com/ || echo 000)
            echo "tentativa $i: gnhorizons.com -> $code"
            if [ "$code" != "000" ]; then
              exit 0
            fi
            if [ "$i" -lt 3 ]; then
              sleep 60
            fi
          done
          echo "DNS:"
          getent hosts gnhorizons.com || echo "  não resolve"
          echo "::error::VPS inalcançável do runner: o DNS resolve mas nenhuma conexão TCP completa. Duas causas possíveis, indistinguíveis daqui — fail2ban banindo o IP do runner (já aconteceu antes) ou queda real do servidor. Abra https://gnhorizons.com no navegador antes de agir."
          exit 1

      # O deploy é por cron no VPS (a cada 2 min), não por este workflow: logo
      # depois do push o site ainda serve o commit anterior. Esperar o bundle
      # publicado bater com o do repo é o jeito de saber que o deploy chegou —
      # o nome do bundle muda a cada alteração, por ser cacheado imutável.
      - name: Esperar o cron publicar este commit
        run: |
          esperado=$(grep -o 'assets/ventas-[A-Za-z0-9_-]*\.js' assets/nuevo/ventas/index.html | head -1)
          echo "bundle esperado: $esperado"
          for i in 1 2 3 4 5; do
            curl -sk --max-time 20 -o /tmp/ventas.html https://gnhorizons.com/ventas/ || true
            publicado=$(grep -o 'assets/ventas-[A-Za-z0-9_-]*\.js' /tmp/ventas.html 2>/dev/null | head -1)
            echo "tentativa $i: publicado = ${publicado:-<nenhum>}"
            if [ "$esperado" = "$publicado" ]; then
              echo "OK  deploy chegou"
              exit 0
            fi
            if [ "$i" -lt 5 ]; then
              sleep 70
            fi
          done
          echo "::error::Passados ~6 min o site ainda serve um bundle diferente do commit. O cron do VPS (/opt/gnh-autodeploy.sh, a cada 2 min) não pegou este commit ou o deploy falhou. Confira: tail -5 /var/log/gnh-autodeploy.log no VPS."
          exit 1

      - name: Conteúdo no ar
        run: |
          # gnhorizons.com é o site OFICIAL e sua home tem que ser o redesign.
          # Os dois domínios servem a mesma raiz /opt/gnh; o vortex é só o
          # preview do dono. Se o marcador do redesign sumir da home do
          # gnhorizons.com, o root do bloco do Caddy está errado — foi o que
          # aconteceu entre jul e ago/2026. Ver CLAUDE.md e DEPLOY-GNH.md.
          curl -sk --max-time 25 \
                 -o /tmp/home.html   -w 'gnhorizons home    %{http_code}\n' https://gnhorizons.com/ \
            --next -o /tmp/prod.html -w 'página de produto  %{http_code}\n' https://gnhorizons.com/ventas/ensayo-a-compresion-hst-yes2000/ \
            --next -I -o /tmp/hdr.txt -w 'headers do produto %{http_code}\n' https://gnhorizons.com/ventas/ensayo-a-compresion-hst-yes2000/

          falhas=0
          ver() {  # ver <arquivo> <marcador> <descrição>
            if grep -qF "$2" "$1" 2>/dev/null; then
              echo "OK     $3"
            else
              echo "FALHOU $3  (não achei '$2' em $(basename "$1"))"
              falhas=$((falhas + 1))
            fi
          }

          ver /tmp/home.html 'SZ34D'       'home do gnhorizons.com É o redesign (se falhar: root do Caddy)'
          ver /tmp/prod.html 'HST-YES2000' 'página de produto publicada'

          # O HTML precisa sair com no-cache, senão o navegador segura a versão
          # velha e o deploy "não aparece". Ver DEPLOY-GNH.md § manutenção do VPS.
          ver /tmp/hdr.txt 'no-cache' 'subpágina de produto com Cache-Control: no-cache'

          echo
          if [ "$falhas" = "0" ]; then
            echo "Tudo no ar."
          else
            echo "$falhas verificação(ões) falharam."
            exit 1
          fi
